name: Refresh live cache

on:
  schedule:
    # Every 6 hours — keeps GitHub Pages live-cache fresh (CORS-safe).
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install pandas numpy scipy
      - name: Refresh cache from Yahoo
        run: python scripts/refresh_live_cache.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sample_data/live_cache.json
          if git diff --staged --quiet; then
            echo "No cache changes"
          else
            git commit -m "chore: refresh Pages live market cache"
            git push
          fi
